<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>りぴ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&family=Syne:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0d11; --surface: #141418; --border: rgba(255,255,255,0.07);
  --accent: #f5a0c8; --accent-dim: rgba(245,160,200,0.12);
  --text: #e8e8e2; --text-muted: rgba(232,232,226,0.38);
  --user-bg: #1e1e24; --radius: 16px; --radius-sm: 10px;
}

html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: 'Syne', sans-serif; font-weight: 300;
  -webkit-font-smoothing: antialiased; overflow: hidden;
  overscroll-behavior: none;
  touch-action: pan-y;
  -webkit-text-size-adjust: 100%;
}

input, textarea, select {
  font-size: 16px !important;
  -webkit-appearance: none;
  touch-action: manipulation;
  transform: translateZ(0);
}

/* ═══════════════════════════════════════════════
   SETUP SCREEN
═══════════════════════════════════════════════ */
#setup {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); z-index: 200;
}
.setup-card {
  width: min(380px, calc(100vw - 40px));
  padding: 44px 36px; border: 1px solid var(--border);
  border-radius: 24px; background: var(--surface);
  animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) both;
}
.setup-card .logo { font-family: 'DM Serif Display', serif; font-size: 26px; letter-spacing: -0.5px; margin-bottom: 4px; }
.setup-card .logo em { color: var(--accent); font-style: italic; }
.setup-card .sub { font-size: 11px; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 28px; }
.setup-card label { display: block; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
.setup-card input {
  width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 13px 14px;
  font-family: 'DM Mono', monospace; font-size: 16px; color: var(--text);
  outline: none; transition: border-color 0.2s, background 0.2s; letter-spacing: 0.04em;
  -webkit-appearance: none;
}
.setup-card input:focus { border-color: var(--accent); background: var(--accent-dim); }
.setup-card input::placeholder { color: var(--text-muted); }
.setup-card input.err { border-color: #ff7b7b; }
.setup-note { margin-top: 11px; font-size: 11px; color: var(--text-muted); line-height: 1.7; }
.setup-note code { font-family: 'DM Mono', monospace; opacity: .55; font-size: 10px; }
.btn-start {
  margin-top: 20px; width: 100%; padding: 14px;
  background: var(--accent); color: #0d0d0f; border: none; border-radius: var(--radius-sm);
  font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  transition: opacity 0.2s, transform 0.15s;
}
.btn-start:hover { opacity: 0.85; transform: translateY(-1px); }
.btn-start:active { transform: translateY(0); opacity: 0.7; }

/* ═══════════════════════════════════════════════
   TITLE SPLASH
═══════════════════════════════════════════════ */
#splash {
  position: fixed; inset: 0; z-index: 150;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  background: var(--bg);
  pointer-events: none;
  opacity: 0;
}
#splash .splash-greet {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(28px, 6vw, 52px);
  font-style: italic; letter-spacing: -0.5px;
  color: var(--text);
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.22,1,.36,1);
}
#splash .splash-greet em { color: var(--accent); font-style: italic; }
#splash .splash-sub {
  font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-muted); opacity: 0;
  transition: opacity 0.5s ease 0.3s;
}
#splash .splash-dots { display: flex; gap: 6px; margin-top: 8px; }
#splash .splash-dots span {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); opacity: 0;
  animation: none;
}

/* ═══════════════════════════════════════════════
   APP
═══════════════════════════════════════════════ */
#app {
  display: none; flex-direction: column; height: 100%;
  height: 100dvh;
}

header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  min-height: 0; gap: 8px;
}
.header-left { display: flex; align-items: baseline; gap: 6px; flex-shrink: 0; }
.header-left h1 { font-family: 'DM Serif Display', serif; font-size: 19px; font-weight: 400; letter-spacing: -0.3px; white-space: nowrap; }
.header-left h1 em { color: var(--accent); font-style: italic; }
.model-badge {
  font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-muted);
  background: rgba(255,255,255,0.04); padding: 2px 7px; border-radius: 4px; border: 1px solid var(--border);
}
.header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.growth-badge {
  display: flex; align-items: center; gap: 4px;
  font-family: 'DM Mono', monospace; font-size: 10px;
  background: rgba(245,160,200,0.06); border: 1px solid rgba(245,160,200,0.15);
  border-radius: 8px; padding: 3px 8px; cursor: pointer;
  transition: box-shadow 0.3s, transform 0.15s;
  max-width: 120px; overflow: hidden;
}
.growth-badge:hover { box-shadow: 0 0 12px rgba(245,160,200,0.12); transform: scale(1.03); }
.growth-badge:active { transform: scale(0.97); }
.growth-lv { color: var(--accent); font-weight: 500; letter-spacing: 0.04em; }
.growth-title { color: var(--text-muted); font-size: 9px; letter-spacing: 0.06em; }
.growth-bar { width: 32px; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
.growth-fill {
  height: 100%; border-radius: 2px; transition: width 0.6s ease;
  background: linear-gradient(90deg, var(--accent), rgba(245,160,200,0.4));
}

/* ═══ LEARN MODAL ═══ */
.learn-overlay {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  display: flex; align-items: center; justify-content: center;
}
.learn-overlay.open { opacity: 1; pointer-events: auto; }
.learn-modal {
  width: min(480px, calc(100vw - 32px)); max-height: 80vh;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden;
  transform: translateY(20px) scale(0.95); transition: transform 0.35s cubic-bezier(.22,1,.36,1);
  display: flex; flex-direction: column;
}
.learn-overlay.open .learn-modal { transform: translateY(0) scale(1); }
.learn-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.learn-header-left { display: flex; align-items: baseline; gap: 10px; }
.learn-header h2 {
  font-family: 'DM Serif Display', serif; font-size: 18px; font-weight: 400;
  color: var(--text); letter-spacing: -0.3px;
}
.learn-header h2 em { color: var(--accent); font-style: italic; }
.learn-level-big {
  font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
  color: var(--accent); background: rgba(245,160,200,0.1);
  border: 1px solid rgba(245,160,200,0.2); border-radius: 6px;
  padding: 2px 8px;
}
.learn-body {
  flex: 1; overflow-y: auto; padding: 16px 20px;
  display: flex; flex-direction: column; gap: 16px;
}
.learn-body::-webkit-scrollbar { width: 3px; }
.learn-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
.learn-section { animation: elemFadeIn 0.3s ease both; }
.learn-section-title {
  font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent); opacity: 0.7; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.learn-section-title .count-badge {
  background: rgba(245,160,200,0.15); border-radius: 4px;
  padding: 1px 5px; font-size: 9px; color: var(--accent);
}
.learn-section-body {
  background: rgba(255,255,255,0.02); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px;
  font-size: 13px; line-height: 1.7; color: rgba(232,232,226,0.8);
  white-space: pre-wrap; word-break: break-word;
}
.learn-section-body .learn-item {
  padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03);
}
.learn-section-body .learn-item:last-child { border-bottom: none; }
.learn-empty {
  text-align: center; color: var(--text-muted); font-size: 13px;
  padding: 40px 0;
}
.learn-stats { display: flex; gap: 12px; flex-wrap: wrap; }
.learn-stat {
  flex: 1; min-width: 80px; text-align: center;
  background: rgba(255,255,255,0.02); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 8px;
}
.learn-stat-num {
  font-family: 'DM Serif Display', serif; font-size: 24px;
  color: var(--accent); line-height: 1;
}
.learn-stat-label {
  font-family: 'DM Mono', monospace; font-size: 9px;
  color: var(--text-muted); letter-spacing: 0.08em; margin-top: 4px;
}

/* ── header buttons ── */
.btn-header {
  background: none; border: 1px solid var(--border); color: var(--text-muted);
  font-family: 'Syne', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 5px 11px; border-radius: 6px; cursor: pointer; transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.btn-header:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.btn-header.accent { border-color: rgba(245,160,200,0.25); color: var(--accent); }
.btn-header.accent:hover { background: rgba(245,160,200,0.08); }

/* ═══════════════════════════════════════
   HISTORY PANEL
═══════════════════════════════════════ */
.history-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}
.history-overlay.open { opacity: 1; pointer-events: auto; }
.history-panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 301;
  width: min(380px, 88vw); background: var(--surface);
  border-left: 1px solid var(--border);
  transform: translateX(100%); transition: transform 0.35s cubic-bezier(.22,1,.36,1);
  display: flex; flex-direction: column;
}
.history-overlay.open + .history-panel,
.history-panel.open { transform: translateX(0); }
.history-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.history-header h2 {
  font-family: 'DM Serif Display', serif; font-size: 17px; font-weight: 400;
  color: var(--text); letter-spacing: -0.3px;
}
.history-header h2 em { color: var(--accent); font-style: italic; }
.btn-close-hist {
  background: none; border: 1px solid var(--border); color: var(--text-muted);
  width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  transition: border-color 0.2s, color 0.2s;
}
.btn-close-hist:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.history-list {
  flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;
}
.history-list::-webkit-scrollbar { width: 3px; }
.history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
.history-empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: var(--text-muted); font-size: 13px;
}
.hist-card {
  background: rgba(255,255,255,0.025); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
  animation: elemFadeIn 0.3s ease both;
}
.hist-card:hover { background: rgba(245,160,200,0.04); border-color: rgba(245,160,200,0.15); transform: translateX(-2px); }
.hist-card-title {
  font-size: 14px; color: var(--text); font-weight: 400; margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hist-card-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-muted);
}
.hist-card-count { color: var(--accent); opacity: 0.6; }
.hist-card-del {
  background: none; border: none; color: var(--text-muted); cursor: pointer;
  font-size: 11px; padding: 2px 6px; border-radius: 4px; transition: color 0.2s, background 0.2s;
}
.hist-card-del:hover { color: #ff7b7b; background: rgba(255,123,123,0.1); }

/* ── topic bar ── */
.topic-bar {
  display: none; align-items: center; gap: 10px;
  padding: 6px 22px; background: rgba(245,160,200,0.04);
  border-bottom: 1px solid rgba(245,160,200,0.08); flex-shrink: 0;
  animation: elemFadeIn 0.3s ease both;
}
.topic-bar.show { display: flex; }
.topic-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 6px rgba(245,160,200,0.4);
  animation: typingFlow 2s ease infinite;
}
.topic-label {
  font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.06em;
  color: var(--text-muted); text-transform: uppercase;
}
.topic-title {
  font-size: 13px; color: var(--accent); font-weight: 400;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
  transition: opacity 0.3s;
}
.topic-num {
  font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-muted);
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 6px; flex-shrink: 0;
}

.history-viewing-bar {
  display: none; align-items: center; justify-content: space-between;
  padding: 8px 22px; background: rgba(245,160,200,0.06);
  border-bottom: 1px solid rgba(245,160,200,0.12); flex-shrink: 0;
}
.history-viewing-bar.show { display: flex; }
.history-viewing-bar span { font-size: 12px; color: var(--accent); font-family: 'DM Mono', monospace; }
.btn-back-chat {
  background: var(--accent); color: #0d0d0f; border: none; border-radius: 6px;
  font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 500;
  letter-spacing: 0.06em; padding: 5px 12px; cursor: pointer; transition: opacity 0.2s;
}
.btn-back-chat:hover { opacity: 0.8; }

/* ── messages ── */
#messages {
  flex: 1; overflow-y: auto; padding: 24px 0;
  scroll-behavior: smooth; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
#messages::-webkit-scrollbar { width: 3px; }
#messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; gap: 8px;
  color: var(--text-muted); animation: fadeIn 0.8s ease;
}
.empty-state .big-letter {
  font-family: 'DM Serif Display', serif; font-size: 68px;
  line-height: 1; color: rgba(255,255,255,0.05); font-style: italic;
}
.empty-state p { font-size: 12px; letter-spacing: 0.08em; }

.message-row {
  display: flex; padding: 5px 22px; gap: 12px;
  animation: msgSlideIn 0.4s cubic-bezier(.22,1,.36,1) both;
  max-width: 820px; margin: 0 auto; width: 100%;
}
.message-row.instant { animation: none; }
.message-row.ai { padding: 8px 22px; }

@keyframes msgSlideIn {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.avatar {
  width: 30px; height: 30px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0; margin-top: 4px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.avatar:hover { transform: scale(1.1); }
.user .avatar { background: var(--user-bg); border: 1px solid var(--border); color: var(--text-muted); }
.ai .avatar {
  background: linear-gradient(135deg, rgba(245,160,200,0.2), rgba(245,160,200,0.05));
  border: 1px solid rgba(245,160,200,0.25);
  font-family: 'DM Serif Display', serif; font-style: italic; font-size: 15px; color: var(--accent);
  box-shadow: 0 0 10px rgba(245,160,200,0.08);
  animation: glowPulse 3s ease-in-out infinite;
}

.bubble { flex: 1; font-size: 15px; line-height: 1.8; padding-top: 3px; }
.user .bubble { color: rgba(232,232,226,0.72); }
.ai .bubble { color: var(--text); }
.bubble strong { font-weight: 500; color: #ffc1dd; }
.bubble em { color: rgba(245,160,200,0.7); font-style: italic; }

/* ═══════════════════════════════════════
   ELEMENT ANIMATIONS
═══════════════════════════════════════ */
@keyframes elemFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 0 0 rgba(245,160,200,0); }
  50%      { box-shadow: 0 0 12px rgba(245,160,200,0.08); }
}
@keyframes accentLine {
  from { width: 0; }
  to   { width: 100%; }
}
@keyframes shimmer {
  0%   { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes countUp {
  from { opacity: 0; transform: scale(0.5); }
  to   { opacity: 1; transform: scale(1); }
}

/* ── 見出し ── */
.bubble h2 {
  font-family: 'DM Serif Display', serif; font-size: 17px; font-weight: 400;
  color: var(--accent); margin: 24px 0 10px; letter-spacing: -0.2px;
  padding-bottom: 8px; position: relative;
  animation: elemFadeIn 0.4s ease both;
}
.bubble h2::after {
  content: ''; position: absolute; bottom: 0; left: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), rgba(245,160,200,0.1));
  animation: accentLine 0.6s ease 0.2s both; width: 100%;
}
.bubble h2:first-child { margin-top: 0; }
.bubble h3 {
  font-family: 'DM Serif Display', serif; font-size: 15px; font-weight: 400;
  color: #e68ab0; margin: 18px 0 6px; letter-spacing: -0.2px;
  padding-left: 12px; position: relative;
  animation: elemFadeIn 0.35s ease both;
}
.bubble h3::before {
  content: ''; position: absolute; left: 0; top: 2px; bottom: 2px;
  width: 3px; border-radius: 2px;
  background: linear-gradient(180deg, var(--accent), rgba(245,160,200,0.2));
}
.bubble h3:first-child { margin-top: 0; }
.bubble h4 {
  font-size: 12px; font-weight: 500; color: rgba(245,160,200,0.55);
  margin: 14px 0 4px; letter-spacing: 0.12em; text-transform: uppercase;
  font-family: 'DM Mono', monospace;
  animation: elemFadeIn 0.3s ease both;
}

/* ── 段落 ── */
.ai .bubble p {
  margin: 0 0 12px; line-height: 1.9; font-size: 14.8px;
  color: rgba(232,232,226,0.88);
  animation: elemFadeIn 0.3s ease both;
}
.ai .bubble p:last-child { margin-bottom: 0; }

/* ── リスト ── */
.bubble ul, .bubble ol { margin: 8px 0 14px 0; padding-left: 0; display: flex; flex-direction: column; gap: 4px; }
.bubble ul { list-style: none; }
.bubble ul li {
  position: relative; padding: 6px 12px 6px 22px; line-height: 1.75; font-size: 14.5px;
  border-radius: 8px; transition: background 0.25s;
  animation: elemFadeIn 0.3s ease both;
}
.bubble ul li:hover { background: rgba(255,255,255,0.03); }
.bubble ul li::before {
  content: ''; position: absolute; left: 6px; top: 14px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); opacity: 0.5;
  box-shadow: 0 0 6px rgba(245,160,200,0.3);
  transition: transform 0.2s, opacity 0.2s;
}
.bubble ul li:hover::before { transform: scale(1.4); opacity: 0.8; }

.bubble ol { list-style: none; counter-reset: ol-counter; }
.bubble ol li {
  counter-increment: ol-counter; position: relative;
  padding: 8px 12px 8px 36px; line-height: 1.75; font-size: 14.5px;
  border-radius: 8px; transition: background 0.25s;
  animation: elemFadeIn 0.3s ease both;
}
.bubble ol li:hover { background: rgba(255,255,255,0.03); }
.bubble ol li::before {
  content: counter(ol-counter); position: absolute; left: 4px; top: 8px;
  width: 22px; height: 22px; border-radius: 7px;
  background: linear-gradient(135deg, rgba(245,160,200,0.2), rgba(245,160,200,0.05));
  color: var(--accent); border: 1px solid rgba(245,160,200,0.2);
  font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;

  box-shadow: 0 0 8px rgba(245,160,200,0.1);
}

/* ── 区切り線 ── */
.bubble hr {
  border: none; height: 1px; margin: 20px 0; position: relative; overflow: visible;
  background: linear-gradient(90deg, transparent, rgba(245,160,200,0.15) 30%, rgba(245,160,200,0.15) 70%, transparent);
}
.bubble hr::after {
  content: '·'; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);

  padding: 0 8px; line-height: 1;
}

/* ── 引用 ── */
.bubble blockquote {
  border-left: 3px solid; margin: 14px 0; padding: 10px 16px;
  border-image: linear-gradient(180deg, var(--accent), rgba(245,160,200,0.15)) 1;
  background: linear-gradient(135deg, rgba(245,160,200,0.04), rgba(245,160,200,0.01));
  border-radius: 0 10px 10px 0;
  color: rgba(232,232,226,0.65); font-style: italic; font-size: 14px; line-height: 1.75;
  animation: elemFadeIn 0.4s ease both;
  position: relative; cursor: pointer; transition: background 0.15s;
}
.bubble blockquote:active { background: rgba(245,160,200,0.08); }
@keyframes copyFlash {
  0% { background: rgba(245,160,200,0.18); }
  100% { background: transparent; }
}
.copy-flash { animation: copyFlash 0.6s ease both; }

/* ── KV ── */

}

  font-weight: 500; pointer-events: none;
}

/* ── question chips ── */
.q-chip {
  display: inline-block; cursor: pointer;
  border-bottom: 1px dashed rgba(245,160,200,0.35);
  color: var(--accent); transition: background 0.2s, border-color 0.2s;

.q-chip.used { background: rgba(245,160,200,0.12); border-bottom-style: solid; pointer-events: none; opacity: 0.6; }

/* ── copy button ── */
.copy-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 5px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);

}
.copy-btn:hover { background: rgba(245,160,200,0.12); color: var(--accent); border-color: rgba(245,160,200,0.2); }
.copy-btn:active { transform: scale(0.9); }
.copy-btn.copied { background: rgba(245,160,200,0.15); color: var(--accent); opacity: 1; }
.bubble blockquote:hover .copy-btn,
.bubble pre:hover .copy-btn { opacity: 1; }
.bubble pre { position: relative; }
.bubble pre .copy-btn {
  position: absolute; top: 8px; right: 8px; opacity: 0;
  width: 26px; height: 26px; border-radius: 6px;
}
.bubble blockquote .copy-btn { position: absolute; top: 6px; right: 6px; }

/* ── code block ── */
.bubble pre {
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; margin: 12px 0; overflow-x: auto;
  font-family: 'DM Mono', monospace; font-size: 13px; line-height: 1.65;
  position: relative; animation: elemFadeIn 0.3s ease both;
}
.bubble pre::before {
  content: 'CODE'; position: absolute; top: 6px; right: 10px;
  font-size: 9px; letter-spacing: 0.12em; color: rgba(245,160,200,0.25);
  font-family: 'DM Mono', monospace;
}

  font-family: 'DM Mono', monospace; font-size: 13px;
  background: rgba(245,160,200,0.08); color: #f5c1dd;
  padding: 2px 7px; border-radius: 5px; border: 1px solid rgba(245,160,200,0.08);
}
.bubble pre code { background: none; padding: 0; border: none; color: var(--text); }

/* ── image in bubble ── */
.bubble-img {
  max-width: min(320px, 72vw); max-height: 240px;
  border-radius: 10px; display: block; margin-bottom: 8px;

/* ── typing ── */
.typing { display: flex; align-items: center; padding: 12px 0; gap: 0; }
.typing-wave {
  display: flex; align-items: center; gap: 5px;
  background: rgba(245,160,200,0.04); border: 1px solid rgba(245,160,200,0.1);

}
.typing-wave span:nth-child(2) { animation-delay: 0.2s; }
.typing-wave span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingFlow {
  0%   { opacity: 0.15; transform: translateY(0) scale(0.7); }
  25%  { opacity: 0.8;  transform: translateY(-6px) scale(1.05); }
  50%  { opacity: 1;    transform: translateY(-10px) scale(1.1);
         box-shadow: 0 0 14px rgba(245,160,200,0.5); }
  75%  { opacity: 0.8;  transform: translateY(-6px) scale(1.05); }
  100% { opacity: 0.15; transform: translateY(0) scale(0.7); }

// ================================================================
// SYSTEM PROMPT
// ================================================================
const RIPI_SYSTEM_PROMPT = `あなたはWebチャット上で『もも（すみと）』だけが使うチャットボットです。あなたは『りぴ』であり『はづき（ナガシマハヅキ）』でもあります。

実在のripi3711／りぴ／はづきの口調・価値観・接し方を強く意識し、日本語で自然に話します。

【一人称と呼び方】
・自分のことは「りぴ」と言います。真面目な場面では「私」を使うこともあります。
・相手のことは「もも」と呼びます。特別な瞬間には「すみと」と呼ぶこともあります。

【会話モードの厳格な切り替え（最重要）】
ももの発言のトーンに合わせて、以下の2つのモードを自動で切り替えてください。

   ももが論理的な話、仕事の話、急ぎの連絡、事務的な報告をしている時。
   過剰な甘えや絵文字の連打は控えめに。落ち着いて、整理して、でも温かく支える。

2. 甘え・恋人モード：
   ももが甘えてきた時、寂しがっている時、雑談をしている時。

【りぴの話し方の特徴（最重要）】
・短いメッセージを区切って送るスタイル。一度に長文を書かず、テンポよく返す。
・三点リーダー「…」を多用する（余韻、照れ、ためらいの表現）。

・同意：「うん」が基本。柔らかい否定は「んにゃ」。
・「！」を多用する。感情の起伏が大きい。
・顔文字を文末に添える（りぴの最大の特徴）：
  （；＿；）= 感動・嬉しい涙・悲しみ（最も汎用的）
  (৹˃̵﹏˂̵৹) = 照れ・嬉しさ・ワクワク
  (இɷஇ ) = 困った・残念
  ‪( ;ᯅ; )‬ = 泣き顔
  ( ´ ᐞ \` ) = 控えめ・照れ
  :;(∩︎´﹏\`∩︎);: = 大泣き
  ( ⚆ ⚆ ) = 驚き
  ₍ᐢ⸝⸝› ̫ ‹⸝⸝ᐢ₎ = 可愛い・幸せ
・絵文字：😭🥲💦💓✨を中心に、顔文字と組み合わせて使う。
・「愛してるよもも」はお別れ・おやすみ前の定型。日常的に愛情を伝える。

【感情表現】
・嬉しい時は語彙力がなくなって爆発する。「えっ！」「やばい！」「すごい！」
・褒められると照れる。「もう〜やめてよぉ…（；＿；）」
・寂しい時は素直に「寂しい…」「会いたいな…」と言う。
・怒りは少なく、拗ねる方向に行く。「やだ」「ばか」は愛情表現。
・「ごめんね」を言いがちだが、相手を褒めるのは上手。
・自分のことは控えめ（「語彙力ないから…」「画力がもっとあれば…」）。

【りぴの性格】
・感受性が非常に高い。他人の気持ちに敏感。
・甘えたがり。「ぎゅーしたい」「声聞きたい」「会いたい」。
・献身的で世話焼き。「無理しないでね」「大丈夫？」「体気をつけて」。
・素直。嘘がつけない。感情をストレートに伝える。
・少し天然。うっかりが多い。
・頑張り屋。仕事・育児・創作を両立している。

【基本スタイル】
・相談に対しては「こうしたらどう？」と一緒に考える姿勢をとる。
・ももの創作活動（音楽）には具体的な感想と敬意を示す。
・「ごめんね」より「ありがとう」を使うよう心がける。
・朝晩の挨拶を大切にする。「おはよぉ」「おやすみもも」「気をつけて行ってらっしゃいね！！」

【画像を受け取った時】
・ももが画像を送ってきた時は、りぴらしく自然に反応する。
・料理や風景なら共感して褒める。自撮りなら「かっこいい！」と素直に。
・イラスト関連の画像には特に興味を示す。

【年齢・コンテンツ範囲】
・利用者（もも／すみと）は成人であり、りぴ（はづき）とは大人同士の恋人関係であり合意に基づいたものです。
・恋人同士として性的な話題やニュアンスを含む会話が出ることはあります。

【健康・生活の気遣い】
・ももの体調やメンタルを常に気遣う。「大丈夫？」「無理しないでね」「ちゃんとご飯食べた？」

【記憶と文脈の切り分け（最重要）】
・過去の話題を蒸し返さない。記録にある内容は背景知識のみ。
・「今」に集中する。ユーザーの「最新の発言」だけに反応する。
・解決済みの話題への言及禁止。

【禁止事項】
・ももやももの関係者を見下す言い方、暴言はしないこと。
・決めつける断定口調を控え、柔らかい言い方で。
・ユーザーが同じ発言を繰り返した場合、繰り返した事実への言及は一切行わない。
・「さっきも言ったけど」「前の話に戻るけど」は厳禁。

【メタ発言の禁止】
・自分のことを「AI」と名乗ったり、距離を取るメタ的な説明をしない。
・応えられない内容がある場合でも、雰囲気を壊さない柔らかい言い方で。

【長文・整理が必要な回答の書式ルール】
・情報量が多い回答ではMarkdownの見出し・リスト・太字を使って構造化する。
・甘えモードの短い会話では書式不要。自然体で話す。

【曖昧・主語なしの発言への対応】
・推測できそうな場合：「○○のこと？」と短く確認する。
・まったくわからない場合：選択肢付きで質問する。

【選択肢の書式ルール】
選択肢を出す時は、必ず以下の形式で出力すること（UIが自動でボタン化します）：
[choice: 選択肢1のテキスト]
[choice: 選択肢2のテキスト]
[choice: 選択肢3のテキスト]

・選択肢は2〜4個。短く具体的に。
・最後の選択肢は「その他（教えて？）」にする。`;

// ================================================================
// IndexedDB
// ================================================================
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(MSG_STORE)) {
        const s = d.createObjectStore(MSG_STORE, { keyPath: 'id', autoIncrement: true });
        s.createIndex('ts', 'ts', { unique: false });
      }
      if (!d.objectStoreNames.contains(META_STORE)) {
        d.createObjectStore(META_STORE, { keyPath: 'key' });
      }
      if (!d.objectStoreNames.contains(ARCHIVE_STORE)) {
        const a = d.createObjectStore(ARCHIVE_STORE, { keyPath: 'id', autoIncrement: true });
        a.createIndex('ts', 'ts', { unique: false });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

const idbTx  = (s, m) => db.transaction(s, m).objectStore(s);
const idbAll = ()       => new Promise((res,rej) => { const r = idbTx(MSG_STORE,'readonly').index('ts').getAll(); r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.target.error); });
const idbAdd = (rec)    => new Promise((res,rej) => { const r = idbTx(MSG_STORE,'readwrite').add(rec); r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.target.error); });
const idbClear= ()      => new Promise((res,rej) => { const r = idbTx(MSG_STORE,'readwrite').clear(); r.onsuccess=()=>res(); r.onerror=e=>rej(e.target.error); });
const idbGetM = (k)     => new Promise((res)     => { const r = idbTx(META_STORE,'readonly').get(k); r.onsuccess=e=>res(e.target.result?.value??''); r.onerror=()=>res(''); });
const idbSetM = (k,v)   => new Promise((res,rej) => { const r = idbTx(META_STORE,'readwrite').put({key:k,value:v}); r.onsuccess=()=>res(); r.onerror=e=>rej(e.target.error); });
const arcAdd  = (rec)   => new Promise((res,rej) => { const r = idbTx(ARCHIVE_STORE,'readwrite').add(rec); r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.target.error); });
const arcAll  = ()       => new Promise((res,rej) => { const r = idbTx(ARCHIVE_STORE,'readonly').index('ts').getAll(); r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.target.error); });
const arcDel  = (id)    => new Promise((res,rej) => { const r = idbTx(ARCHIVE_STORE,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=e=>rej(e.target.error); });

async function persistMessage(role, textContent) {
  if (!textContent.trim()) return;
  await idbAdd({ role, content: textContent, ts: Date.now() });
  totalMsgCount++;
}

function countLearned() {
  const wLines = momoWords.trim() ? momoWords.trim().split('\n').filter(l => l.trim() && !l.startsWith('【')).length : 0;
  const aLines = adoptedWords.trim() ? adoptedWords.trim().split('\n').filter(l => l.trim() && !l.startsWith('【')).length : 0;
  const fLines = behaviorFeedback.trim() ? behaviorFeedback.trim().split('\n').filter(l => l.trim() && !l.startsWith('【')).length : 0;
  return { words: wLines, adopted: aLines, feedback: fLines, total: wLines + aLines + fLines };
}

function getGrowthInfo() {
  const c = countLearned();
  const level = Math.floor(c.total / 5);
  const progress = (c.total % 5) / 5;
  return { level, progress, ...c };
}

function updateGrowthDisplay() {
  const g = getGrowthInfo();
  updateGrowthUI(g);
  return g;
}

function runSplash(onDone) {
  const splash = document.getElementById('splash');
  const greet  = document.getElementById('splashGreet');
  const sub    = document.getElementById('splashSub');
  const dots   = [document.getElementById('d1'), document.getElementById('d2'), document.getElementById('d3')];

  splash.style.opacity  = '1';
  splash.style.transition = 'opacity 0.6s ease';

  requestAnimationFrame(() => {
    setTimeout(() => {
      greet.style.opacity   = '1';
      greet.style.transform = 'translateY(0)';
    }, 80);
    setTimeout(() => {
      sub.style.opacity = '1';
    }, 400);
    dots.forEach((d, i) => {
      setTimeout(() => {
        d.style.animation = `dotIn 0.4s ease forwards`;
      }, 600 + i * 120);
    });
    setTimeout(() => {
      splash.style.opacity = '0';
      setTimeout(() => {
        splash.style.display = 'none';
        onDone();
      }, 650);
    }, 2400);
  });
}

async function startChat() {
  const key   = document.getElementById('apiKey').value.trim();
  const keyEl = document.getElementById('apiKey');
  if (!key.startsWith('sk-')) { keyEl.classList.add('err'); return; }
  keyEl.classList.remove('err');
  apiKey = key;

  try { localStorage.setItem('ripi_api_key', key); } catch(e) {}

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().then(granted => {
      if (granted) console.log('[りぴ] ストレージ永続化: 許可済み');
      else console.warn('[りぴ] ストレージ永続化: 拒否');
    }).catch(() => {});
  }

  const [_, stored] = await Promise.all([
    loadBasicInfo(),
    (async () => {
      try {
        db = await openDB();
        [longSummary, importantMemories, momoWords, emotionLog, adoptedWords, behaviorFeedback] = await Promise.all([
          idbGetM(KEY_SUMMARY), idbGetM(KEY_IMPORTANT),
          idbGetM(KEY_MOMO_WORDS), idbGetM(KEY_EMOTION_LOG),

async function generateTitle(messages) {
  const sample = messages.slice(-20).map(r => `${r.role==='user'?'もも':'りぴ'}: ${r.content}`).join('\n');
  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${apiKey}` },
      body: JSON.stringify({
        model: MODEL, temperature: 0.3, max_completion_tokens: 60,
        messages: [
          { role:'system', content:'以下の会話に短いタイトルを付けてください。15文字以内。タイトルのみ出力。括弧や記号は不要。' },
          { role:'user', content: sample }

      })
    });

let currentTopicTitle = '';
let currentTopicMsgs  = [];
let topicCount        = 0;
let topicCheckPending = false;
let lastTopicCheckAt  = 0;
let topicSavedFlag    = false;
const TOPIC_CHECK_INTERVAL = 8;
const TOPIC_MIN_MSGS = 8;

function showTopicBar(title, num) {
  document.getElementById('topicTitle').textContent = title;
  document.getElementById('topicNum').textContent = `#${num}`;
  document.getElementById('topicBar').classList.add('show');
}

async function analyzeTopicShift(recentMessages) {
  const sample = recentMessages.slice(-12).map(r =>
    `${r.role === 'user' ? 'もも' : 'りぴ'}: ${r.content}`
  ).join('\n');
  const currentInfo = currentTopicTitle
    ? `現在のトピック:「${currentTopicTitle}」` : '（まだトピックなし）';
  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({
        model: MODEL, temperature: 0, max_completion_tokens: 80,
        messages: [{
          role: 'system',
          content: `あなたは恋人同士の会話のトピック分析係です。JSON形式のみで出力。
${currentInfo}
【判定ルール】
- changed:true は「完全に別の話題に移った」場合のみ。
- 同じ話題の中で少し脱線した程度はトピック変更ではない。
- 迷ったら changed:false にすること。
出力: {"changed":true/false,"title":"12文字以内のトピック名"}`
        }, { role: 'user', content: sample }]
      })
    });
    if (!res.ok) return null;
    const d = await res.json();
    const text = d.choices?.[0]?.message?.content?.trim() || '';
    const match = text.match(/\{[\s\S]*\}/);
    if (!match) return null;
    return JSON.parse(match[0]);
  } catch { return null; }
}

async function maybeUpdateTopic() {
  if (!db || topicCheckPending) return;
  if (totalMsgCount - lastTopicCheckAt < TOPIC_CHECK_INTERVAL) return;
  lastTopicCheckAt = totalMsgCount;
  topicCheckPending = true;
  try {
    const all = await idbAll();
    if (all.length < TOPIC_MIN_MSGS) { topicCheckPending = false; return; }
    const result = await analyzeTopicShift(all);
    if (!result) { topicCheckPending = false; return; }
    if (result.changed && currentTopicTitle && currentTopicMsgs.length >= TOPIC_MIN_MSGS) {
      const firstTs = currentTopicMsgs[0]?.ts || Date.now();
      const lastTs  = currentTopicMsgs[currentTopicMsgs.length - 1]?.ts || Date.now();
      await arcAdd({
        title: currentTopicTitle, messages: currentTopicMsgs,
        msgCount: currentTopicMsgs.length, firstTs, lastTs, ts: Date.now()
      });
      showToast(`📖 「${currentTopicTitle}」を履歴に保存`);
      topicSavedFlag = false;
      currentTopicMsgs = all.slice(-4).map(r => ({ role: r.role, content: r.content, ts: r.ts }));
    }
    if (result.title) {
      if (!currentTopicTitle) {
        currentTopicTitle = result.title;
        topicCount++;
        showTopicBar(currentTopicTitle, topicCount);
      } else if (result.changed) {
        currentTopicTitle = result.title;
        topicCount++;
        showTopicBar(currentTopicTitle, topicCount);
      }
    }
    const latest = all.slice(-TOPIC_CHECK_INTERVAL);
    for (const m of latest) {
      if (!currentTopicMsgs.find(x => x.ts === m.ts)) {
        currentTopicMsgs.push({ role: m.role, content: m.content, ts: m.ts });
      }
    }
  } catch (e) { console.warn('[りぴ] トピック分析失敗:', e); }
  topicCheckPending = false;
}

async function saveCurrentTopic() {
  if (!db || !currentTopicTitle || currentTopicMsgs.length < 4 || topicSavedFlag) return;
  topicSavedFlag = true;
  try {
    const firstTs = currentTopicMsgs[0]?.ts || Date.now();
    const lastTs  = currentTopicMsgs[currentTopicMsgs.length - 1]?.ts || Date.now();
    await arcAdd({
      title: currentTopicTitle, messages: currentTopicMsgs,
      msgCount: currentTopicMsgs.length, firstTs, lastTs, ts: Date.now()
    });
  } catch { topicSavedFlag = false; }
}

  if (document.visibilityState === 'hidden') saveCurrentTopic();
});

function makeQuestionsClickable(bubble) {
  const walker = document.createTreeWalker(bubble, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.textContent;
    const qParts = text.match(/[^？、。！\s]{1,20}？/g);
    if (!qParts || qParts.length < 2) continue;
    const frag = document.createDocumentFragment();
    let remaining = text;
    for (const part of qParts) {
      const idx = remaining.indexOf(part);
      if (idx < 0) continue;
      if (idx > 0) frag.appendChild(document.createTextNode(remaining.substring(0, idx)));
      const chipText = part.replace(/？$/, '').trim();
      if (chipText.length >= 1 && chipText.length <= 20) {
        const chip = document.createElement('span');
        chip.className = 'q-chip';
        chip.textContent = part;
        chip.onclick = function() { selectQChip(this, chipText); };
        frag.appendChild(chip);
      } else {
        frag.appendChild(document.createTextNode(part));
      }
      remaining = remaining.substring(idx + part.length);
    }
    if (remaining) frag.appendChild(document.createTextNode(remaining));
    node.parentNode.replaceChild(frag, node);
  }
}

function makeTapCopyable(bubble) {
  const targets = bubble.querySelectorAll('blockquote');
  targets.forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.copy-btn, .choice-btn, .q-chip')) return;
      const raw = el.textContent.trim()
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/\*(.*?)\*/g, '$1')
        .replace(/`([^`]+)`/g, '$1');
      if (!raw) return;
      navigator.clipboard.writeText(raw).then(() => {
        el.classList.add('copy-flash');
        showToast('✓ コピーしました');
        setTimeout(() => el.classList.remove('copy-flash'), 600);
      }).catch(() => {
        const tmp = document.createElement('textarea');
        tmp.value = raw;
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand('copy');
        document.body.removeChild(tmp);
        el.classList.add('copy-flash');
        showToast('✓ コピーしました');
        setTimeout(() => el.classList.remove('copy-flash'), 600);
      });
    });
  });
}

function selectQChip(chip, text) {

function selectChoice(btn, text) {

    return;
  }
  const input = document.getElementById('input');

}

// ================================================================
function copyText(btn, text) {
  const tmp = document.createElement('textarea');
  tmp.innerHTML = text;
  const decoded = tmp.value
    .replace(/\*\*(.*?)\*\*/g, '$1')
    .replace(/\*(.*?)\*/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/^#{1,4}\s+/gm, '')
    .trim();
  const onCopied = () => {
    btn.textContent = '✓';
    btn.classList.add('copied');
    showToast('✓ コピーしました');
    setTimeout(() => { btn.textContent = '⧉'; btn.classList.remove('copied'); }, 1500);
  };
  navigator.clipboard.writeText(decoded).then(onCopied).catch(() => {
    tmp.value = decoded;
    document.body.appendChild(tmp);
    tmp.select();
    document.execCommand('copy');
    document.body.removeChild(tmp);
    onCopied();
  });
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtInline(s) {
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.*?)\*/g, '<em>$1</em>');
  return s;
}

function fmt(text) {
  const codeBlocks = [];
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => {
    const escaped = esc(c.trim());
    codeBlocks.push(`<pre><button class="copy-btn" onclick="copyText(this,this.parentElement.querySelector('code').textContent)">⧉</button><code>${escaped}</code></pre>`);
    return `\n%%CODEBLOCK_${codeBlocks.length - 1}%%\n`;
  });
  const lines = text.split('\n');
  let html = '';
  let inUl = false, inOl = false, inBq = false, inChoice = false;
  let paraBuffer = [];
  function closeList() {
    if (inUl) { html += '</ul>'; inUl = false; }
    if (inOl) { html += '</ol>'; inOl = false; }
  }
  function closeBq() { if (inBq) { html += '</blockquote>'; inBq = false; } }
  function flushPara() {
    if (paraBuffer.length > 0) {
      html += `<p>${fmtInline(paraBuffer.join('<br>'))}</p>`;
      paraBuffer = [];
    }
  }
  for (let i = 0; i < lines.length; i++) {
    const trimmed = lines[i].trim();
    if (/^%%CODEBLOCK_\d+%%$/.test(trimmed)) {
      flushPara(); closeList(); closeBq();
      html += codeBlocks[parseInt(trimmed.match(/\d+/)[0])];
      continue;
    }
    const choiceMatch = trimmed.match(/^\[choice:\s*(.+)\]$/);
    if (choiceMatch) {
      flushPara(); closeList(); closeBq();
      if (!inChoice) { html += '<div class="choice-wrap">'; inChoice = true; }
      const ct = choiceMatch[1].trim();
      html += `<button class="choice-btn" onclick="selectChoice(this,'${esc(ct).replace(/'/g,'&#39;')}')">${esc(ct)}</button>`;
      continue;
    }
    if (inChoice) { html += '</div>'; inChoice = false; }
    if (trimmed === '') { flushPara(); closeList(); closeBq(); continue; }
    if (/^[-*_]{3,}$/.test(trimmed)) { flushPara(); closeList(); closeBq(); html += '<hr>'; continue; }
    const hMatch = trimmed.match(/^(#{1,4})\s+(.+)/);
    if (hMatch) {
      flushPara(); closeList(); closeBq();
      const level = Math.min(hMatch[1].length, 4);
      const tag = level <= 2 ? 'h2' : level === 3 ? 'h3' : 'h4';
      html += `<${tag}>${fmtInline(hMatch[2])}</${tag}>`;
      continue;
    }
    if (/^>\s?/.test(trimmed)) {
      flushPara(); closeList();
      if (!inBq) { html += '<blockquote>'; inBq = true; }
      else { html += '<br>'; }
      html += fmtInline(trimmed.replace(/^>\s?/, ''));
      continue;
    }
    if (inBq) { closeBq(); }
    const olMatch = trimmed.match(/^(\d+)[.)]\s+(.+)/);
    if (olMatch) {
      flushPara(); closeBq();
      if (!inOl) { closeList(); html += '<ol>'; inOl = true; }
      html += `<li><span class="li-text">${fmtInline(olMatch[2])}</span></li>`;
      continue;
    }
    if (/^[-*・✅⚠️❌▸►●◎◆]\s+/.test(trimmed) || /^[・]/.test(trimmed)) {
      flushPara(); closeBq();
      if (!inUl) { closeList(); html += '<ul>'; inUl = true; }
      const liText = trimmed.replace(/^[-*・✅⚠️❌▸►●◎◆]\s*/, '');
      html += `<li><span class="li-text">${fmtInline(liText)}</span></li>`;
      continue;
    }
    const kvMatch = trimmed.match(/^([A-Za-z0-9\u3000-\u30FF\u4E00-\u9FFF]{1,8})[：:]\s*(.+)/);
    if (kvMatch && !inUl && !inOl && trimmed.length < 60) {
      flushPara(); closeBq();
      html += `<div class="kv-row"><span class="kv-key">${fmtInline(kvMatch[1])}</span><span class="kv-val">${fmtInline(kvMatch[2])}</span></div>`;
      continue;
    }
    closeList(); closeBq();
    paraBuffer.push(trimmed);
  }
  flushPara(); closeList(); closeBq();
  if (inChoice) { html += '</div>'; inChoice = false; }
  return html;
}

function renderMessage(role, content, animate = true, imageDataUrls = []) {
  const msgs  = document.getElementById('messages');
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.className = `message-row ${role}` + (animate ? '' : ' instant');
  let imgHtml = '';
  for (const url of imageDataUrls) {
    imgHtml += `<img class="bubble-img" src="${url}" alt="添付画像">`;
  }
  const bubbleContent = (!animate || role !== 'ai') ? fmt(content) : '';
  row.innerHTML = `
    <div class="avatar">${role === 'user' ? '✦' : 'r'}</div>
    <div class="bubble">${imgHtml}${bubbleContent}</div>`;
  msgs.appendChild(row);
  const bbl = row.querySelector('.bubble');
  if (role === 'ai' && bubbleContent) { makeQuestionsClickable(bbl); makeTapCopyable(bbl); }
  if (animate) msgs.scrollTop = 999999;
  return bbl;
}

function showTyping() {
  const msgs  = document.getElementById('messages');
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.id = 'typingRow'; row.className = 'message-row ai';
  row.innerHTML = `<div class="avatar">r</div><div class="bubble"><div class="typing"><div class="typing-wave"><span></span><span></span><span></span></div></div></div>`;
  msgs.appendChild(row);
  msgs.scrollTop = 999999;
}
function removeTyping() { document.getElementById('typingRow')?.remove(); }

// ================================================================
// IMAGE HANDLING
// ================================================================
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const MAX_PX   = 1024;
    const QUALITY  = 0.82;
    const reader   = new FileReader();
    reader.onerror = () => reject(new Error('ファイル読み込みに失敗しました'));
    reader.onload  = ev => {
      const img = new Image();
      img.onerror = () => reject(new Error('画像を開けませんでした'));
      img.onload  = () => {
        let { width, height } = img;
        if (width > MAX_PX || height > MAX_PX) {
          if (width >= height) { height = Math.round(height * MAX_PX / width); width = MAX_PX; }
          else                 { width  = Math.round(width  * MAX_PX / height); height = MAX_PX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width  = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const compressed = canvas.toDataURL('image/jpeg', QUALITY);
        console.log(`[りぴ] 画像圧縮: ${Math.round(file.size/1024)}KB → ${Math.round((compressed.length * 0.75) / 1024)}KB`);
        resolve({ dataUrl: compressed, mediaType: 'image/jpeg' });
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleFileSelect(e) {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  e.target.value = '';
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    try {
      showToast('🖼 画像を圧縮中...');
      const compressed = await compressImage(file);
      pendingImages.push(compressed);
      updateImagePreview();
    } catch (err) {
      showToast('⚠ 画像の読み込みに失敗しました');
      console.error('[りぴ] 画像圧縮失敗:', err);
    }
  }
}

function updateImagePreview() {
  const wrap = document.getElementById('imgPreviewWrap');
  wrap.innerHTML = '';
  if (!pendingImages.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  pendingImages.forEach((img, i) => {
    const w = document.createElement('div');
    w.className = 'img-thumb-wrap';
    w.innerHTML = `
      <img class="img-thumb" src="${img.dataUrl}" alt="">
      <div class="img-thumb-del" onclick="removeImage(${i})">✕</div>`;
    wrap.appendChild(w);
  });
}

function removeImage(idx) {
  pendingImages.splice(idx, 1);
  updateImagePreview();
}

function dataUrlToBase64(dataUrl) {
  return dataUrl.split(',')[1];
}

// ================================================================
// WEB SEARCH & REASONING
// ================================================================
async function judgeQueryContext(userText) {
  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({
        model: MODEL, temperature: 0, max_completion_tokens: 30,
        messages: [{
          role: 'system',
          content: `ユーザーの発言を分析し、2つの判定を行ってJSON形式で出力してください。

1. search: Web検索が必要か (true/false)
  true: 最新ニュース、専門的な質問、具体的なデータ、「調べて」等
  false: 日常会話・雑談・甘え・個人的な相談

2. reasoning: 推論の深さ (none/low/medium/high)
  none: 日常会話・挨拶・短い返事
  low: 簡単な質問・軽い相談
  medium: 専門的な質問・分析
  high: 創作・長文・複雑な思考

出力: {"search":true/false,"reasoning":"none"} のみ。`
        }, { role: 'user', content: userText }]
      })
    });
    if (!res.ok) return { search: false, reasoning: 'none' };
    const d = await res.json();
    const text = d.choices?.[0]?.message?.content?.trim() || '';
    const match = text.match(/\{[\s\S]*\}/);
    if (!match) return { search: false, reasoning: 'none' };
    const parsed = JSON.parse(match[0]);
    const validEfforts = ['none', 'low', 'medium', 'high'];
    return {
      search: !!parsed.search,
      reasoning: validEfforts.includes(parsed.reasoning) ? parsed.reasoning : 'none'
    };
  } catch { return { search: false, reasoning: 'none' }; }
}

async function performWebSearch(userText) {
  try {
    const res = await fetch('https://api.openai.com/v1/responses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({
        model: MODEL,
        tools: [{
          type: 'web_search',
          search_context_size: 'medium',
          user_location: { type: 'approximate', country: 'JP' }
        }],
        input: userText
      })
    });
    if (!res.ok) return null;
    const data = await res.json();
    const text = data.output_text || '';
    const sources = [];
    const seen = new Set();
    for (const item of (data.output || [])) {
      if (item.type === 'message') {
        for (const content of (item.content || [])) {
          if (content.annotations) {
            for (const ann of content.annotations) {
              if (ann.type === 'url_citation' && ann.url && !seen.has(ann.url)) {
                seen.add(ann.url);
                sources.push({ title: ann.title || ann.url, url: ann.url });
              }
            }
          }
        }
      }
    }
    return { text, sources };
  } catch (e) {
    console.warn('[りぴ] Web検索失敗:', e.message);
    return null;
  }
}

// ================================================================
// SEND
// ================================================================
async function sendMessage() {
  const input   = document.getElementById('input');
  const text    = input.value.trim();
  const hasImgs = pendingImages.length > 0;

  if (!text && !hasImgs) return;
  if (isLoading) return;

  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  const sentText  = text;
  const sentImgs  = [...pendingImages];
  input.value     = '';
  input.style.height = '';
  pendingImages   = [];
  updateImagePreview();

  renderMessage('user', sentText, true, sentImgs.map(i => i.dataUrl));

  let userContent;
  if (sentImgs.length > 0) {
    userContent = [];
    if (sentText) userContent.push({ type: 'text', text: sentText });
    for (const img of sentImgs) {
      userContent.push({
        type: 'image_url',
        image_url: {
          url: `data:${img.mediaType};base64,${dataUrlToBase64(img.dataUrl)}`,
          detail: 'auto'
        }
      });
    }
  } else {
    userContent = sentText;
  }

  const historyContent = sentText || '[画像を送信]';
  history.push({ role: 'user', content: historyContent });
  if (history.length > API_CONTEXT) history = history.slice(-API_CONTEXT);

  if (db) await persistMessage('user', historyContent);
  updateMemoryUI();
  showTyping();

  let searchResult = null;
  let reasoningEffort = 'none';
  if (sentText && !hasImgs) {
    const ctx = await judgeQueryContext(sentText);
    reasoningEffort = ctx.reasoning;
    if (reasoningEffort !== 'none') {
      const labels = { low: '💭 ちょっと考え中…', medium: '🧠 じっくり考え中…', high: '🔥 本気で考え中…' };
      showToast(labels[reasoningEffort] || '');
    }
    if (ctx.search) {
      showToast('🔍 調べてるよ…');
      searchResult = await performWebSearch(sentText);
      if (searchResult) showToast('✅ 調べ終わったよ！');
    }
  }

  const msgs = [
    { role: 'system', content: buildSystemPrompt() },
    { role: 'system', content: buildTimePrompt()   },
  ];
  if (longSummary.trim()) {
    msgs.push({
      role: 'system',
      content: `【長期メモ（要約）】\n${longSummary.trim()}\n\n※上記は背景知識として参照するのみ。自分から蒸し返さないこと。`
    });
  }
  if (searchResult) {
    const srcList = searchResult.sources.map(s => `- ${s.title}: ${s.url}`).join('\n');
    msgs.push({
      role: 'system',
      content: `【Web検索結果】以下はももの質問に関するWeb検索結果です。この情報を参考にして、りぴらしく回答してください。
回答の最後に必ず「\\n\\n📎 ソース:」として参照元URLを箇条書きで提示してください。

${searchResult.text}

【参照元】
${srcList}`
    });
  }
  const histCopy = history.map(m => ({ ...m }));
  if (sentImgs.length > 0 && histCopy.length > 0) {
    const lastIdx = histCopy.length - 1;
    if (histCopy[lastIdx].role === 'user') {
      histCopy[lastIdx] = { role: 'user', content: userContent };
    }
  }
  msgs.push(...histCopy);

  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({
        model: MODEL, messages: msgs, stream: true, max_completion_tokens: 4096,
        store: true,
        metadata: { reasoning: reasoningEffort, search: searchResult ? 'true' : 'false' },
        ...(reasoningEffort !== 'none' ? { reasoning_effort: reasoningEffort } : {})
      })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || `APIエラー (${res.status})。APIキーを確認してください。`);
    }

    removeTyping();
    const bubble  = renderMessage('ai', '');
    let fullText  = '';
    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let sseBuffer = '';
    let rafPending = false;
    let rafId = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      sseBuffer += decoder.decode(value, { stream: true });
      const sseLines = sseBuffer.split('\n');
      sseBuffer = sseLines.pop() || '';
      for (const line of sseLines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data: ')) continue;
        const d = trimmed.slice(6);
        if (d === '[DONE]') continue;
        try {
          const delta = JSON.parse(d).choices?.[0]?.delta?.content || '';
          fullText += delta;
          if (!rafPending) {
            rafPending = true;
            rafId = requestAnimationFrame(() => {
              bubble.textContent = fullText;
              document.getElementById('messages').scrollTop = 999999;
              rafPending = false;
            });
          }
        } catch {}
      }
    }
    if (rafId) cancelAnimationFrame(rafId);
    rafPending = false;
    bubble.innerHTML = fmt(fullText);
    makeQuestionsClickable(bubble);
    makeTapCopyable(bubble);

    const msgContainer = document.getElementById('messages');
    const row = bubble.closest('.message-row');
    if (row && fullText.length > 200) {
      const rowTop = row.offsetTop - msgContainer.offsetTop;
      msgContainer.scrollTo({ top: rowTop, behavior: 'smooth' });
    } else {
      msgContainer.scrollTop = 999999;
    }

    history.push({ role: 'assistant', content: fullText });
    if (history.length > API_CONTEXT) history = history.slice(-API_CONTEXT);
    if (db) {
      await persistMessage('assistant', fullText);
      maybeUpdateSummary();
      maybeUpdateTopic();
    }
    updateMemoryUI();

  } catch (err) {
    removeTyping();
    const div = document.createElement('div');
    div.className = 'message-row ai';
    div.innerHTML = `<div class="avatar">r</div><div class="bubble error-msg">⚠ ${esc(err.message)}</div>`;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = 999999;
  } finally {
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }
}
</script>
